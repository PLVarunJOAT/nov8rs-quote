<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build your quote · nov8rs</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0E12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#0D0E12; --card:#15171D; --field:#1C1E26; --raise:#20232C; --line:#2F323D; --line-strong:#454A57;
  --ink:#F5F6F8; --label:#E6E8EE; --muted:#C4C8D2; --faint:#A2A7B5;
  --gold:#E8B33A; --gold-ink:#15171D; --gold-soft:rgba(232,179,58,.12);
  --ok:#6FD39E; --ok-soft:rgba(111,211,158,.12); --warn:#FFB070; --warn-soft:rgba(255,176,112,.12); --err:#FF9A8B;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit}
a{color:var(--gold)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:rgba(13,14,18,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1160px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.logo img{height:30px;width:auto;display:block}
.top .sub{color:var(--faint);font-size:14px;border-left:1px solid var(--line);padding-left:14px}
.top .grow{flex:1}
.badge{font:600 12px var(--body);color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:99px}

/* Layout */
.wrap{max-width:1160px;margin:0 auto;padding:24px 20px 96px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
.grid.full{grid-template-columns:minmax(0,880px);justify-content:center}
.grid.full .rail{display:none}

/* Progress */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1px solid var(--line);background:transparent;color:var(--faint);font-size:13px;font-weight:500;padding:6px 12px;border-radius:99px;cursor:default;white-space:nowrap}
.steps button.done{color:var(--label);border-color:var(--line-strong);cursor:pointer}
.steps button.done:hover{border-color:var(--gold)}
.steps button.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}

/* Panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}
@media (max-width:560px){.panel{padding:22px 18px;border-radius:14px}}
.kicker{margin:0;font:600 13px var(--mono);color:var(--gold);letter-spacing:.02em}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
@media (max-width:560px){h1{font-size:24px}}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 22px;max-width:64ch}
.tip{font-size:14.5px;color:var(--label);background:var(--gold-soft);border:1px solid rgba(232,179,58,.3);padding:11px 14px;border-radius:10px;margin:-6px 0 18px;max-width:64ch}

/* Questions */
.q{display:grid;gap:10px;padding-block:20px}
.q + .q{border-top:1px solid var(--line)}
.q.reveal{animation:in .22s ease-out}
@keyframes in{from{opacity:.3;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ql{font-weight:600;font-size:16px;color:var(--label)}
.help{color:var(--muted);font-size:14px;margin-top:-6px}
.opt-note{color:var(--faint);font-weight:400;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--field);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line-strong)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:6px;display:grid;place-items:center}
.opt.single .box{border-radius:50%}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt.sel .box{border-color:var(--gold);background:var(--gold)}
.opt.sel .box::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--gold-ink)}
.opt.single.sel .box::after{border-radius:50%}
.opt:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.opt .t{display:grid;gap:3px;min-width:0}
.opt .t b{font-weight:600;font-size:15px;color:var(--ink)}
.opt .t small{color:var(--muted);font-size:13.5px;line-height:1.45}
.big .opts{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.big .opt{padding:18px}
.big .opt .t b{font-size:18px;letter-spacing:-.01em}
.txt{width:100%;font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
.txt::placeholder{color:var(--faint);opacity:1}
.txt:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,179,58,.22)}
.txt.num{max-width:160px}
.q.bad .opt,.q.bad .txt{border-color:rgba(255,154,139,.55)}
.err{color:var(--err);font-size:14px}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
@media (max-width:560px){.nav .btn{flex:1}}

/* Rail */
.rail{position:sticky;top:84px}
.rail .panel{padding:20px}
.rail h3{margin:0 0 12px;font-size:15px;color:var(--label);display:flex;justify-content:space-between;align-items:center}
.busy{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .2s}
.busy.on{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.plan{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.plan li{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--label)}
.plan li span:last-child{font:500 13px var(--mono);color:var(--muted);white-space:nowrap;text-align:right}
.plan li.rv span:first-child::after{content:" · review";color:var(--warn);font-size:12px}
.tots{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot small{color:var(--muted);font-size:13.5px}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tot .money{font-size:20px;font-weight:600}
.empty{color:var(--muted);font-size:14px;margin:0}

/* Mobile totals bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(21,23,29,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;gap:12px}
.mbar div{display:grid}
.mbar .mid{align-self:center;text-align:center}
.mbar small{color:var(--muted);font-size:12px}
.mbar .money{font-size:17px;font-weight:600}
@media (max-width:900px){.mbar.show{display:flex}}

/* Quote */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px}
.status.ready{background:var(--ok-soft);color:var(--ok)}
.status.review{background:var(--warn-soft);color:var(--warn)}
.bigtots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:22px 0 16px}
.bigtots div{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.bigtots small{display:block;color:var(--muted);font-size:13.5px;margin-bottom:2px}
.bigtots .money{font-size:30px;font-weight:600;letter-spacing:-.02em}
.saving{background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:15px;padding:12px 16px;border-radius:12px;margin:0 0 16px}
.offer{border:1.5px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:18px 20px;display:grid;gap:8px;margin:0 0 20px}
.offer .ot{font:600 12.5px var(--mono);color:var(--gold)}
.offer h2{margin:0}
.offer p{margin:0;color:var(--label);max-width:64ch}
.offer .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.offer .row span{color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto;margin-top:6px}
table.lines{width:100%;border-collapse:collapse;font-size:15px;min-width:460px}
.lines th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
.lines th.r,.lines td.money{text-align:right;white-space:nowrap}
.lines td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--label)}
.lines tr.grp td{color:var(--gold);font:600 13px var(--mono);padding-top:20px;border-bottom:0}
.lines td small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lines .flag{color:var(--warn);font-size:13px;font-weight:600}
.lines tr.sum td{font-weight:700;color:var(--ink);border-bottom:0}
.soft{color:var(--muted)}
.notes{margin-top:16px;display:grid;gap:6px}
.notes p{margin:0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
@media (max-width:560px){.actions .btn{flex:1 1 100%}}
@media (max-width:560px){
  table.lines{min-width:0}
  .lines thead{display:none}
  .lines tr{display:flex;flex-wrap:wrap;gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
  .lines td{border:0;padding:0}
  .lines td:first-child{flex:1 1 100%}
  .lines td.money{text-align:left}
  .lines td.money:empty,.lines td.money:has(.dash){display:none}
  .lines td.money[data-label]:not(:empty)::before{content:attr(data-label) " ";color:var(--muted);font:500 12.5px var(--body)}
  .lines tr.grp{padding:16px 0 0;border:0}
  .lines tr.sum{border:0}
}
.cal{margin-top:28px;border-top:1px solid var(--line);padding-top:24px}
.cal iframe{width:100%;min-height:760px;border:0;border-radius:12px;background:#fff}
.center{text-align:center;padding:24px 0}
.center .lede{margin-inline:auto}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{color:var(--ok);font-size:14px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Configurator */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:14px;background:var(--field);transition:border-color .15s,background .15s}
.card.on{grid-column:1/-1;border-color:var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--field)}
.card.bad{border-color:var(--err)}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(232,179,58,.6)}100%{box-shadow:0 0 0 14px rgba(232,179,58,0)}}
.card-head{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;color:inherit;padding:16px 18px;cursor:pointer;border-radius:14px}
.card-head:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card-head .tick{flex:none;width:22px;height:22px;margin-top:2px;border:1.5px solid var(--line-strong);border-radius:7px;display:grid;place-items:center;transition:all .15s}
.card.on .tick{background:var(--gold);border-color:var(--gold)}
.card.on .tick::after{content:"";width:6px;height:11px;border:solid var(--gold-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.card-head .t{flex:1;display:grid;gap:3px;min-width:0}
.card-head b{font-size:16.5px;font-weight:600;color:var(--ink)}
.card-head small{color:var(--muted);font-size:14px;line-height:1.45}
.card-head .price{flex:none;font:600 13.5px var(--mono);color:var(--gold);text-align:right;white-space:nowrap;padding-top:2px}
.card-body{padding:2px 18px 18px 54px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (max-width:560px){.card-body{padding:2px 16px 16px}.card-head{flex-wrap:wrap}.card-head .price{order:3;flex-basis:100%;text-align:left;padding:0 0 0 36px}.card-head .price:empty{display:none}}
.ctl{display:grid;gap:8px}
.ctl-l{font-size:13.5px;font-weight:600;color:var(--label)}
.ctl-d{color:var(--muted);font-size:13.5px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line-strong);background:var(--card);color:var(--label);font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:99px;cursor:pointer}
.seg button:hover,.chip:hover{border-color:var(--ink)}
.seg button:not(.chip)[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--gold);font-weight:700}
.seg button:focus-visible,.chip:focus-visible,.stepper button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:99px;background:var(--card);width:max-content}
.stepper button{width:44px;height:42px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;border-radius:99px}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper input{width:52px;text-align:center;border:0;background:none;color:var(--ink);font:600 16px var(--mono);-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:14.5px;color:var(--label);max-width:100%}
.switch input{position:absolute;opacity:0}
.switch .sw{flex:none;width:42px;height:24px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch input:checked + .sw{background:var(--gold)}
.switch input:checked + .sw::after{transform:translateX(18px);background:var(--gold-ink)}
.switch input:focus-visible + .sw{outline:2px solid var(--gold);outline-offset:2px}
.hint{margin:0;font-size:13.5px;color:var(--label);background:rgba(232,179,58,.08);border:1px dashed rgba(232,179,58,.45);border-radius:10px;padding:9px 12px}
.extras{margin-top:22px;display:grid;gap:18px;border-top:1px solid var(--line);padding-top:22px}
.delta{display:inline-block;font:600 12.5px var(--mono);color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:2px 8px;margin-left:8px;opacity:0;transition:opacity .2s}
.delta.show{opacity:1}
.delta.down{color:var(--ok);background:var(--ok-soft)}
.ctl.bad .seg button,.ctl.bad .txt{border-color:rgba(255,154,139,.6)}
.lines tr.adj td{color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="https://nov8rs.io" aria-label="nov8rs home">
    <img src="https://images.leadconnectorhq.com/image/f_webp/q_80/r_1200/u_https://storage.googleapis.com/funnel-ai-production/chat/mBQCwOW0KIqC0clAH007/logo-dark.png" alt="nov8rs" onerror="this.replaceWith(document.createTextNode('nov8rs'))">
  </a>
  <span class="sub">Quote builder</span>
  <span class="grow"></span>
  <span class="badge" id="preview" hidden>Preview mode</span>
</div></header>

<div class="wrap">
  <div class="grid">
    <main><div class="panel" id="panel" aria-live="polite"></div></main>
    <aside class="rail" id="rail"></aside>
  </div>
</div>
<div class="mbar" id="mbar"></div>
<noscript><p style="padding:20px">Please turn on JavaScript to build your quote.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
